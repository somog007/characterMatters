[build]
  # Build from the web folder
  base = "web"
  command = "cd .. && npm ci --legacy-peer-deps --include=dev --workspaces=true && npm run prisma:check-versions && npm run prisma8:generate && npm --prefix backend run build && NODE_ENV=test npm --prefix backend test -- --runInBand && cd web && npm run build"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "../node_modules/.prisma/client/**",
    "../backend/node_modules/.prisma/client/**"
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/welcome"
  status = 301

[[redirects]]
  from = "/landing/*"
  to = "/welcome/:splat"
  status = 301

[[redirects]]
  from = "/welcome"
  to = "/welcome/index.html"
  status = 200

[[redirects]]
  from = "/welcome/*"
  to = "/welcome/:splat"
  status = 200

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
