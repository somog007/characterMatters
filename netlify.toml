[build]
  # Build from the web folder
  base = "web"
  command = "cd .. && npm ci --legacy-peer-deps --include=dev --workspaces=true --include-workspace-root && npm run prisma:check-versions && npm --prefix backend run build && NODE_ENV=test npm --prefix backend test -- --runInBand && cd web && npm run build"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "../node_modules/.prisma/client/**",
    "../backend/node_modules/.prisma/client/**"
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/welcome"
  status = 301

[[redirects]]
  from = "/landing/*"
  to = "/welcome/:splat"
  status = 301

[[redirects]]
  from = "/welcome"
  to = "/welcome/index.html"
  status = 200

[[redirects]]
  from = "/welcome/*"
  to = "/welcome/:splat"
  status = 200

# Browser security headers for every page and API response.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
  # Turbopack cache can snapshot unrelated build-time provider credentials; it is not deploy output.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
